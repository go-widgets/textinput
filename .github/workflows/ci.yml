name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux/amd64, os: ubuntu-latest }
          - { name: linux/386 (32-bit offsets), os: ubuntu-latest, goarch: "386" }
          - { name: darwin/arm64, os: macos-latest }
          - { name: windows/amd64, os: windows-latest }
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  wasm:
    name: Test (js/wasm under node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Test under node
        env:
          GOOS: js
          GOARCH: wasm
        run: go test -count=1 -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./...

  coverage:
    name: 100% coverage gate + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache: true

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Assert 100% statement coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk 'END { gsub(/%/,"",$3); print $3 }')
          echo "total coverage: ${total}%"
          if [ "$(printf '%.0f' "$total")" != "100" ]; then
            echo "::error::coverage below 100% (got ${total}%)"
            go tool cover -func=coverage.out | grep -v "100.0%"
            exit 1
          fi

      - name: Cross-compile smoke (all 6 64-bit arches + 386 + wasm + darwin + windows)
        run: |
          for target in linux/amd64 linux/arm64 linux/riscv64 linux/loong64 linux/ppc64le linux/s390x linux/386 js/wasm darwin/arm64 windows/amd64; do
            echo "== $target =="
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  security:
    name: govulncheck + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # The seeds in fuzz_test.go run as ordinary tests above; these two steps
      # search beyond them.
      - name: Fuzz Reconcile for 60 s
        run: go test -run '^$' -fuzz FuzzReconcile -fuzztime 60s .

      - name: Fuzz the UTF-16 helpers for 60 s
        run: go test -run '^$' -fuzz FuzzUTF16 -fuzztime 60s .
